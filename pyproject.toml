[tool.ruff]
line-length = 140
target-version = "py313"
extend-exclude = [".cache", "dist"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "TC"]
ignore = ["D200", "D202", "D212"]
extend-select = ["D213"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-type-checking]
strict = true
exempt-modules = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["scripts", "charts/autoscaling-demo/files"]
disallow_any_explicit = true
disallow_any_unimported = true

[tool.pydocstyle]
convention = "google"
add-ignore = ["D200", "D202", "D212"]
add-select = ["D213"]
match = ".*\\.py"

[tool.pydoclint]
style = "google"
skip-checking-short-docstrings = false
arg-type-hints-in-docstring = true
arg-type-hints-in-signature = true
check-return-types = true
check-arg-order = true
allow-init-docstring = true
require-return-section-when-returning-nothing = true
skip-checking-raises = true
