# yaml-language-server: $schema=values.schema.json
# Reachable address of the host-published provider; never a Pod or Docker IP.
provider:
## @section Provider connection
  ## @param provider.address Host-published provider address and gRPC port.
  address: ""

cluster-autoscaler:
## @section Cluster Autoscaler
  ## @param cluster-autoscaler.fullnameOverride Name used for Cluster Autoscaler resources.
  fullnameOverride: minikube-cluster-autoscaler-addon
  ## @param cluster-autoscaler.cloudProvider Cluster Autoscaler provider; this addon uses externalgrpc.
  cloudProvider: externalgrpc
  autoDiscovery:
    ## @param cluster-autoscaler.autoDiscovery.clusterName Minikube profile name.
    clusterName: minikube
  image:
    ## @param cluster-autoscaler.image.tag Cluster Autoscaler image tag, matched to the Kubernetes minor version.
    tag: v1.35.0
  ## @param cluster-autoscaler.replicaCount Number of Cluster Autoscaler replicas.
  replicaCount: 1
  ## @param cluster-autoscaler.nodeSelector.minikube-autoscaler.astrivant.com/pool Node pool hosting Cluster Autoscaler.
  nodeSelector:
    minikube-autoscaler.astrivant.com/pool: base
  extraArgs:
    ## @param cluster-autoscaler.extraArgs.cloud-config Path to the mounted external gRPC provider configuration.
    cloud-config: /etc/provider/cloud-config.yaml
    ## @param cluster-autoscaler.extraArgs.max-node-provision-time Maximum time allowed for a new worker to become ready.
    max-node-provision-time: 16m
    ## @param cluster-autoscaler.extraArgs.scale-down-delay-after-add Delay before considering scale down after adding a node.
    scale-down-delay-after-add: 5m
    ## @param cluster-autoscaler.extraArgs.scale-down-unneeded-time Time a node must remain unneeded before removal.
    scale-down-unneeded-time: 5m
    ## @param cluster-autoscaler.extraArgs.scale-down-unready-time Time an unready node must remain unneeded before removal.
    scale-down-unready-time: 10m
    ## @param cluster-autoscaler.extraArgs.max-scale-down-parallelism Maximum concurrent node removals.
    max-scale-down-parallelism: 1
    ## @param cluster-autoscaler.extraArgs.max-nodes-per-scaleup Maximum nodes added in one scale-out decision.
    max-nodes-per-scaleup: 1
    ## @param cluster-autoscaler.extraArgs.enable-provisioning-requests Enable ProvisioningRequest processing.
    enable-provisioning-requests: true
    ## @param cluster-autoscaler.extraArgs.skip-nodes-with-local-storage Keep nodes with pods using local storage.
    skip-nodes-with-local-storage: true
    ## @param cluster-autoscaler.extraArgs.skip-nodes-with-system-pods Keep nodes with non-DaemonSet system pods.
    skip-nodes-with-system-pods: true
    ## @param cluster-autoscaler.extraArgs.leader-elect Enable leader election among autoscaler replicas.
    leader-elect: true
    ## @param cluster-autoscaler.extraArgs.v Cluster Autoscaler log verbosity.
    v: 4
  # Provider configuration and client TLS volumes.
  extraVolumes:
    ## @param cluster-autoscaler.extraVolumes[0].name Provider configuration volume name.
    - name: provider-config
      configMap:
        ## @param cluster-autoscaler.extraVolumes[0].configMap.name Provider configuration ConfigMap name.
        name: minikube-cluster-autoscaler-addon-provider
    ## @param cluster-autoscaler.extraVolumes[1].name Client TLS volume name.
    - name: provider-client
      secret:
        ## @param cluster-autoscaler.extraVolumes[1].secret.secretName Client TLS Secret name.
        secretName: minikube-cluster-autoscaler-addon-client
  # Read-only provider configuration and client TLS mounts.
  extraVolumeMounts:
    ## @param cluster-autoscaler.extraVolumeMounts[0].name Mounted volume name.
    - name: provider-config
      ## @param cluster-autoscaler.extraVolumeMounts[0].mountPath Container mount path.
      mountPath: /etc/provider
      ## @param cluster-autoscaler.extraVolumeMounts[0].readOnly Mount the volume read-only.
      readOnly: true
    ## @param cluster-autoscaler.extraVolumeMounts[1].name Mounted volume name.
    - name: provider-client
      ## @param cluster-autoscaler.extraVolumeMounts[1].mountPath Container mount path.
      mountPath: /etc/provider-tls
      ## @param cluster-autoscaler.extraVolumeMounts[1].readOnly Mount the volume read-only.
      readOnly: true
  resources:
    requests:
      ## @param cluster-autoscaler.resources.requests.cpu CPU reserved for Cluster Autoscaler.
      cpu: 100m
      ## @param cluster-autoscaler.resources.requests.memory Memory reserved for Cluster Autoscaler.
      memory: 128Mi
    limits:
      ## @param cluster-autoscaler.resources.limits.cpu CPU limit for Cluster Autoscaler.
      cpu: 500m
      ## @param cluster-autoscaler.resources.limits.memory Memory limit for Cluster Autoscaler.
      memory: 512Mi
