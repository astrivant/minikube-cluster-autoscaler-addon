{{- if lt (int .Values.hpa.maxReplicas) (int .Values.hpa.minReplicas) }}
{{- fail "hpa.maxReplicas must be at least hpa.minReplicas" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "demo.name" . }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  # HPA owns replicas; leaving it unset also preserves scale during upgrades.
  selector:
    matchLabels:
      {{- include "demo.labels" . | nindent 6 }}
      app.kubernetes.io/component: receiver
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "demo.labels" . | nindent 8 }}
        app.kubernetes.io/component: receiver
      annotations:
        checksum/server: {{ .Files.Get "files/server.py" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: minikube-autoscaler.astrivant.com/elastic
          operator: Equal
          value: "true"
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: minikube-autoscaler.astrivant.com/pool
                    operator: In
                    values: [base, elastic]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: minikube-autoscaler.astrivant.com/pool
                    operator: In
                    values: [base]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "demo.labels" . | nindent 18 }}
                  app.kubernetes.io/component: receiver
              topologyKey: kubernetes.io/hostname
      containers:
        - name: receiver
          image: {{ .Values.workload.image | quote }}
          command: [python, -u, -B, /demo/server.py]
          env:
            - name: WORK_MILLISECONDS
              value: {{ .Values.workload.workMilliseconds | quote }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.workload.resources | nindent 12 }}
          volumeMounts:
            - name: scripts
              mountPath: /demo
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: {{ include "demo.name" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "demo.name" . }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: receiver
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "demo.name" . }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "demo.name" . }}
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.targetCPUUtilizationPercentage }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.hpa.scaleDownStabilizationSeconds }}
