# Optional Probot Settings configuration; this file alone does not change GitHub.
repository:
  name: minikube-cluster-autoscaler-addon
  description: Bounded native-VM Minikube autoscaling with a containerized Go provider and authenticated host bridge.
  topics: minikube, kubernetes, cluster-autoscaler, golang, kvm, qemu, helm, autoscaling
  default_branch: main
  has_issues: true
  has_wiki: false
  has_projects: false
  delete_branch_on_merge: true
  allow_squash_merge: true
  enable_vulnerability_alerts: true
branches:
  - name: main
    protection:
      required_status_checks:
        strict: true
        contexts: [CI verification]
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
      enforce_admins: false
      restrictions: null
