name: Minikube autoscaler pipeline
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: minikube-autoscaler-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source:
    name: Resolve source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      release: ${{ steps.source.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          version="v0.0.0-dev.${GITHUB_RUN_NUMBER}"
          release=false
          if [[ "$EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/* ]]; then
            version=$(bash scripts/validate-tag.sh "${GITHUB_REF#refs/tags/}")
            test "$(git rev-parse HEAD)" = "$(git rev-parse "$GITHUB_REF^{commit}")"
            release=true
          fi
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "version=$version"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: source
    uses: ./.github/workflows/stage-test.yml
    with:
      sha: ${{ needs.source.outputs.sha }}

  build:
    name: Build
    needs: source
    uses: ./.github/workflows/stage-build.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      version: ${{ needs.source.outputs.version }}

  verified:
    name: CI verification
    if: always()
    needs: [source, test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every stage to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  coverage-badge:
    name: Publish coverage badge
    needs: [source, test]
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      # Match the direct-header credentials used by the badge action's checkout.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: .cache/coverage-shards
      - name: Combine platform coverage
        run: |
          for runner in ubuntu-24.04 ubuntu-24.04-arm macos-15 macos-15-intel; do
              test -s ".cache/coverage-shards/coverage-$runner/coverage.out"
          done
          python scripts/coverage-summary.py .cache/coverage-shards/coverage-*/coverage.out >> "$GITHUB_STEP_SUMMARY"
      - name: Check whether the badge percentage changed
        id: badge
        run: |
          previous="$RUNNER_TEMP/previous-coverage.svg"
          if [[ -n "$(git ls-remote --heads origin refs/heads/gh-pages)" ]]; then
              git fetch origin gh-pages
              git show FETCH_HEAD:badges/coverage.svg >"$previous" || truncate -s 0 "$previous"
          else
              touch "$previous"
          fi
          python - "$previous" >>"$GITHUB_OUTPUT" <<'PYTHON'
          import json
          import sys
          from pathlib import Path
          from xml.etree import ElementTree

          percent = json.loads(Path("coverage.json").read_text())["totals"]["percent_covered_display"]
          previous = Path(sys.argv[1]).read_text()
          labels = set(ElementTree.fromstring(previous).itertext()) if previous else set()
          print(f"changed={str(f'{percent}%' not in labels).lower()}")
          PYTHON
      - uses: we-cli/coverage-badge-action@8a0b6ee05f6dd0f294089cbe7a848452a2b43eef
        if: steps.badge.outputs.changed == 'true'

  release:
    name: Release
    needs: [source, verified]
    if: needs.verified.result == 'success' && needs.source.outputs.release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/stage-release.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      version: ${{ needs.source.outputs.version }}
