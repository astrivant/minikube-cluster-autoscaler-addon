name: Release stage
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      version:
        type: string
        required: true
permissions:
  contents: write
jobs:
  publish:
    name: Publish verified archives
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish all platforms together
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.sha }}
        run: bash scripts/publish-release.sh "$VERSION" "$SOURCE_SHA"
