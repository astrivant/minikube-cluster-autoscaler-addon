name: Test stage
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
permissions:
  contents: read
jobs:
  vulnerabilities:
    name: Go dependency vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: true
      - name: Scan all Go dependencies
        run: make vuln

  helm-properties:
    name: Helm properties / Kubernetes 1.35.0
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v4.3.0
      - name: Register the chart dependency repository
        run: helm repo add autoscaler https://kubernetes.github.io/autoscaler
      - name: Prepare chart test baseline and documented values
        id: chart-values
        # Path selection uses single-chart mode with a complete values.yaml.
        run: |
          cp -R charts/minikube-cluster-autoscaler-addon "$RUNNER_TEMP/autoscaler-chart"
          helm dependency build "$RUNNER_TEMP/autoscaler-chart"
          sed 's/^  address: ""$/  address: 192.168.105.1:50051/' \
            charts/minikube-cluster-autoscaler-addon/values.yaml > "$RUNNER_TEMP/autoscaler-chart/values.yaml"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          # Match Bitnami-documented values, including fields in array items.
          values = Path("charts/minikube-cluster-autoscaler-addon/values.yaml").read_text()
          names = set()
          for key in re.findall(r"## @param (\S+)", values):
              key = re.sub(r"\[\d+\]", ".*", key)
              names.add("test_" + re.sub(r"[^a-zA-Z0-9_]", "_", key)[:80] + "_")
          def leaf_paths(schema, path=()):
              if schema.get("properties"):
                  for key, child in schema["properties"].items():
                      yield from leaf_paths(child, (*path, key))
              elif schema.get("type") == "array":
                  yield from leaf_paths(schema["items"], (*path, "*"))
              else:
                  yield path

          schema = json.loads(Path("charts/minikube-cluster-autoscaler-addon/values.schema.json").read_text())
          selected = []
          for path in leaf_paths(schema):
              name = "test_" + re.sub(r"[^a-zA-Z0-9_]", "_", "_".join(path))[:80] + "_"
              if name in names:
                  # Match the pinned runner's complete test ID, not a prefix.
                  selected.append(name + hashlib.sha256(repr(path).encode()).hexdigest()[:10])
                  names.remove(name)
          if names:
              raise ValueError(f"Documented values missing from the schema: {sorted(names)}")
          match = " or ".join(sorted(selected))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"match={match}\n")
          PY
      - name: Test chart with hypothesis-helm
        uses: astrivant/hypothesis-helm@dbc07922420fa38ddeead026f7c857eeaae66910 # v1.3.5
        with:
          chart: ${{ runner.temp }}/autoscaler-chart
          match: ${{ steps.chart-values.outputs.match }}
          paths: 'true'
          kube-version: '1.35.0'
          schema-version: '1.35.0'
          seed: '20260927'
          fail: error

  go:
    name: Go / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: true
      - run: go mod verify
      - run: go test -race '-coverprofile=coverage.out' ./...
      - run: go vet ./...
      - name: Check native CLI
        if: runner.os != 'Windows'
        run: |
          go build -mod=readonly -o bin/minikube-cluster-autoscaler-addon .
          bin/minikube-cluster-autoscaler-addon --version
      - name: Check Windows CLI and lifecycle script
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          go build -mod=readonly -o bin/minikube-cluster-autoscaler-addon.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./bin/minikube-cluster-autoscaler-addon.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/addon.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          ./scripts/addon.ps1 -Action help
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.runner }}
          path: coverage.out
          if-no-files-found: error

  lint:
    name: Pre-commit and chart
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/chart-docs/package-lock.json
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - name: Install pinned validation tools
        run: |
          pip install pre-commit==4.3.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          shellcheck --version
      - run: pre-commit run --all-files
      - run: bash scripts/chart-dependencies.sh
      - run: helm lint charts/minikube-cluster-autoscaler-addon --set provider.address=192.168.105.1:50051 --kube-version 1.35.0
      - run: helm lint charts/autoscaling-demo --kube-version 1.35.0
      - run: python3 scripts/test-chart.py
      - run: python3 scripts/test-demo.py
      - name: Render standalone configuration
        env:
          MINIKUBE_AUTOSCALER_CONFIG: examples/config.macos.json
        run: bash scripts/addon.sh render > /dev/null
      - name: Reject changed locks or generated files
        run: git diff --exit-code
