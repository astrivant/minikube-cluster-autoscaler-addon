default_language_version:
  python: python3.13
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(pkg/internal/protos/|LICENSE|charts/.*/provisioningrequests.yaml)
      - id: end-of-file-fixer
        exclude: ^(pkg/internal/protos/|LICENSE|charts/.*/provisioningrequests.yaml)
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^charts/.*/templates/
      - id: check-json
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: [--config=pyproject.toml]
        types: [python]
  - repo: https://github.com/jsh9/pydoclint
    rev: 0.6.6
    hooks:
      - id: pydoclint
        args: [--config=pyproject.toml]
        types: [python]
  - repo: local
    hooks:
      - id: docstring-layout
        name: Multiline docstring layout
        entry: python scripts/check-docstrings.py
        language: python
        types: [python]
      - id: ruff-check
        name: Ruff lint
        entry: ruff check
        language: python
        additional_dependencies: [ruff==0.15.22]
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: ruff format --check
        language: python
        additional_dependencies: [ruff==0.15.22]
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy
        language: python
        additional_dependencies: [mypy==1.20.2, types-PyYAML==6.0.12.20260906]
        types: [python]
        pass_filenames: false
        always_run: true
      - id: gofmt
        name: Go formatting
        entry: bash scripts/check-format.sh
        language: system
        pass_filenames: false
        types: [go]
      - id: go-vet
        name: Go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
        files: '(\.go$|^go\.(mod|sum)$)'
      - id: go-test
        name: Go tests
        entry: go test ./...
        language: system
        pass_filenames: false
        files: '(\.go$|^go\.(mod|sum)$)'
      - id: shellcheck
        name: ShellCheck
        entry: shellcheck
        language: system
        types: [shell]
      - id: shfmt
        name: Shell formatting
        entry: shfmt -d -i 4 -ci
        language: system
        types: [shell]
      - id: actionlint
        name: GitHub workflow validation
        entry: actionlint
        language: system
        pass_filenames: false
        files: ^\.github/workflows/.*\.yml$
